# .sops.yaml
#
# Controls who can decrypt which secrets.
#
# Secret file layout (data) is intentionally separate from module layout.
# Keep encrypted data wherever it makes sense for you, for example:
#   secrets/hosts/<host>.yaml
#   secrets/users/<user@host>.yaml
#
# The main flake imports flakeModules.default, which contributes to its native
# module registry. See README.md; secret data paths do not control module imports.
#
# How it works:
# - `sops <file>` uses the FIRST matching rule below
# - Listed AGE *public* keys become recipients
# - ANY ONE matching *private* key can decrypt
#
# Generate keys:
#   # create a private age key (keep secret)
#   age-keygen -o ~/.config/sops/age/keys.txt
#
#   # print the public key (paste into keys:)
#   age-keygen -y ~/.config/sops/age/keys.txt
#
#   # derive an age public key from an SSH host key
#   ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
#

keys: []

creation_rules:
  # System (host-level) secrets.
  - path_regex: ^secrets/hosts/[^/]+\.ya?ml$
    key_groups:
      - age: []

  # Home (user@host) secrets.
  - path_regex: ^secrets/users/[^/]+\.ya?ml$
    key_groups:
      - age: []

  # Intentionally fail encryption if no rule matched above.
  - path_regex: .*
    key_groups:
      - age: []
